services:
  backend:
    build: ./backend
    container_name: qr-file-sharing-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage

  frontend:
    build: ./frontend
    container_name: qr-file-sharing-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
